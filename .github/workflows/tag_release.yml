name: Create release on version tag
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create_github_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
          
      - name: Z88DK Toolchain setup
        run: |
          sudo snap install z88dk --beta

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch tags
        # --force: with an ANNOTATED release tag, actions/checkout leaves a
        # local tag pointing at the peeled commit; a plain fetch then fails
        # with "would clobber existing tag" and kills the release build
        run: git fetch --tags --force

      - name: Get tag that triggered the workflow
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Version tag detected: $TAG"
          echo "VERSION=$TAG" >> $GITHUB_ENV

      - name: Release notes from CHANGELOG.md
        # The tag's own section: from its "## vX.Y.Z" heading (the rest of
        # the heading line, e.g. the date, is free) to the next "## "
        # heading, both headings excluded. Runs before the builds so a tag
        # without a CHANGELOG entry fails in seconds, not after them.
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md has no (or an empty) '## $VERSION' section"
            exit 1
          fi
          if grep -q "^## $VERSION .*unreleased" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md still marks $VERSION as unreleased"
          fi
          echo "Release notes: $(wc -l < release_notes.md) lines"

      - name: Create build directory
        run: |
          mkdir build

      - name: Run CMake
        run: |
          cmake .. -DFLASH_SIZE=16M -DBOARD=FRUGAL -DUSE_PICO_W=OFF -DVERSION=$VERSION
        working-directory: build

      - name: Build with make
        run: |
          make
        working-directory: build

      - name: Run CMake
        run: |
          cmake .. -DFLASH_SIZE=2M -DBOARD=FRUGAL -DUSE_PICO_W=OFF -DVERSION=$VERSION
        working-directory: build

      - name: Build with make
        run: |
          make
        working-directory: build

      - name: Run CMake
        run: |
          cmake .. -DFLASH_SIZE=2M -DBOARD=FRUGAL -DUSE_PICO_W=ON -DVERSION=$VERSION
        working-directory: build

      - name: Build with make
        run: |
          make
        working-directory: build

      - name: Run CMake
        run: |
          cmake .. -DFLASH_SIZE=2M -DBOARD=DELUXE -DUSE_PICO_W=OFF -DVERSION=$VERSION
        working-directory: build

      - name: Build with make
        run: |
          make
        working-directory: build

      - name: Run CMake
        run: |
          cmake .. -DFLASH_SIZE=2M -DBOARD=DELUXE -DUSE_PICO_W=ON -DVERSION=$VERSION
        working-directory: build

      - name: Build with make
        run: |
          make
        working-directory: build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: true
          files: |
            build/*.uf2